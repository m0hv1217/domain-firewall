<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 圆角方底 -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="#2E5BFF"/>

  <!-- 中心：当前域名 -->
  <circle cx="64" cy="64" r="13" fill="#FFFFFF"/>

  <!-- 左上、右上节点 -->
  <circle cx="32" cy="32" r="8" fill="#FFFFFF"/>
  <circle cx="96" cy="32" r="8" fill="#FFFFFF"/>

  <!-- 右下节点 -->
  <circle cx="96" cy="96" r="8" fill="#FFFFFF"/>

  <!-- 允许的连线 -->
  <line x1="55" y1="55" x2="38" y2="38"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="73" y1="55" x2="90" y2="38"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- 阻断的连线（有缺口） -->
  <line x1="73" y1="73" x2="80" y2="80"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <line x1="90" y1="90" x2="94" y2="94"
        stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- 红色 × 打断 -->
  <line x1="72" y1="84" x2="86" y2="70"
        stroke="#FF4757" stroke-width="6" stroke-linecap="round"/>
  <line x1="72" y1="70" x2="86" y2="84"
        stroke="#FF4757" stroke-width="6" stroke-linecap="round"/>
</svg>